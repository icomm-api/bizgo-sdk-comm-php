name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
          tools: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPUnit (offline, mock HTTP + local built-in server)
        run: vendor/bin/phpunit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: curl, json, mbstring
          coverage: none
          tools: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPStan (level max + strict rules)
        run: vendor/bin/phpstan analyse --no-progress
      - name: PHP_CodeSniffer (PSR-12)
        run: vendor/bin/phpcs
      - name: 생성 모델이 spec과 일치하는지
        run: php bin/generate-models.php --check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          coverage: none
          tools: none
      - name: 의존성 취약점 검사 (runtime + dev, composer.lock 기준)
        run: composer audit --locked
      - name: 배포 아카이브에 테스트·스펙·도구가 빠지는지
        run: |
          git archive --format=tar HEAD | tar -t > archive.txt
          ! grep -E '^(tests|spec|bin|examples|\.github)/' archive.txt
          grep -q '^src/BizgoClient.php$' archive.txt

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (전체 히스토리)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose
