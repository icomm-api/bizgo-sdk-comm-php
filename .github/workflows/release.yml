# v* 태그를 push하면 검증(verify) 뒤 GitHub Release를 만들고, 그 다음에만 Packagist에 새 버전을 알립니다.
#
# 사전 설정(한 번만, 저장소 관리자):
#   1. https://packagist.org/packages/submit 에서 https://github.com/icomm-api/bizgo-sdk-comm-php 를 등록합니다
#      (패키지 이름은 composer.json의 icomm-api/bizgo-sdk-comm). 버전은 git 태그로 정해지며 composer.json에는
#      version 필드를 두지 않습니다.
#   2. Packagist의 GitHub 자동 webhook(저장소 Settings > Webhooks의 packagist.org 항목)은 **끕니다(삭제)**.
#      켜 두면 태그를 push하는 순간 verify 결과와 관계없이 Packagist가 새 버전을 가져갑니다. 이 워크플로의
#      `packagist` job이 verify와 release가 성공한 뒤에만 업데이트 API를 호출합니다.
#   3. 저장소 Settings > Environments에 `release` 환경을 만들고 필수 승인자를 지정합니다. 그 환경의 secret으로만
#      PACKAGIST_USERNAME과 PACKAGIST_API_TOKEN(Packagist 프로필의 API Token, "safe" 권한)을 넣습니다.
#      저장소·조직 secret에는 두지 않고, 이 저장소에 값을 커밋하지 않습니다.
#   4. Settings > Rules(또는 Tags)에서 `v*` 태그 보호 규칙을 켭니다: 관리자만 만들 수 있고, 수정·삭제는 막습니다.
#      태그를 옮겨 이미 배포된 버전의 코드를 바꾸지 못하게 하기 위해서입니다.
#   5. `release` 환경의 배포 브랜치/태그 규칙을 `v*` 태그로 제한합니다.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          extensions: curl, json, mbstring
          coverage: none
          tools: none
      - name: 태그와 Version::SDK가 같은지
        run: |
          version=$(php -r 'require "src/Version.php"; echo Bizgo\Version::SDK;')
          test "v$version" = "$GITHUB_REF_NAME"
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit
      - run: php bin/generate-models.php --check
      - run: composer audit --locked

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: GitHub Release 생성
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "변경 내역은 CHANGELOG.md를 참고하세요." --verify-tag

  packagist:
    # verify와 GitHub Release가 성공한 뒤에만 Packagist를 갱신합니다 (보호된 release 환경의 승인 필요)
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - name: Packagist 업데이트 API 호출
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_API_TOKEN" ]; then
            echo "::error::release 환경에 PACKAGIST_USERNAME / PACKAGIST_API_TOKEN secret이 없습니다 (워크플로 상단 설명 참고)"
            exit 1
          fi
          # 토큰은 URL이 아니라 헤더로 보냅니다(로그·프록시에 URL이 남아도 토큰은 없음)
          curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${PACKAGIST_USERNAME}:${PACKAGIST_API_TOKEN}" \
            -d "{\"repository\":{\"url\":\"https://github.com/${GITHUB_REPOSITORY}\"}}" \
            "https://packagist.org/api/update-package" > /dev/null
